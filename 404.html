<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Practice</title>
  </head>
  <body>
    <script>
      const route = location.pathname || '/';
      sessionStorage.setItem('python-practice-gh-pages-route', route + location.search + location.hash);
      const appBase = route === '/python-basic-course' || route.startsWith('/python-basic-course/')
        ? '/python-basic-course/'
        : '/';
      location.replace(appBase);
    </script>
  </body>
</html>
